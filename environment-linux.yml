# Portable env for Linux / Palmetto (environment.yml is the Windows export).
#   conda env create -f environment-linux.yml
# vLLM pulls in its own matching torch/transformers, so those are left unpinned.
name: thermal_project
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # take an older prebuilt wheel over compiling a newer version from source
      - --prefer-binary
      - vllm
      - ultralytics==8.4.148
      - bitsandbytes
      - accelerate
      - qwen-vl-utils
      - opencv-python-headless
      - pillow
      - polars
      - tqdm
